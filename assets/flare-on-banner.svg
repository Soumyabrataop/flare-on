<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="FLARE-On Challenge Solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0a"/>
      <stop offset="0.55" stop-color="#0d140c"/>
      <stop offset="1" stop-color="#050705"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3b00"/>
      <stop offset="0.45" stop-color="#ff8a00"/>
      <stop offset="0.8" stop-color="#ffd000"/>
      <stop offset="1" stop-color="#fff3b0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- subtle scanlines -->
  <g opacity="0.06" fill="#39ff14">
    <rect y="0" width="1000" height="2"/><rect y="12" width="1000" height="2"/><rect y="24" width="1000" height="2"/>
    <rect y="36" width="1000" height="2"/><rect y="48" width="1000" height="2"/><rect y="60" width="1000" height="2"/>
    <rect y="72" width="1000" height="2"/><rect y="84" width="1000" height="2"/><rect y="96" width="1000" height="2"/>
    <rect y="108" width="1000" height="2"/><rect y="120" width="1000" height="2"/><rect y="132" width="1000" height="2"/>
    <rect y="144" width="1000" height="2"/><rect y="156" width="1000" height="2"/><rect y="168" width="1000" height="2"/>
    <rect y="180" width="1000" height="2"/><rect y="192" width="1000" height="2"/><rect y="204" width="1000" height="2"/>
    <rect y="216" width="1000" height="2"/><rect y="228" width="1000" height="2"/><rect y="240" width="1000" height="2"/>
  </g>

  <!-- flame emblem -->
  <g transform="translate(95,130)" filter="url(#glow)">
    <path d="M0,-78 C34,-40 40,-20 24,6 C50,-8 54,-36 44,-58 C70,-30 72,12 44,42 C62,34 70,18 72,2 C84,36 64,78 18,86 C-32,94 -74,60 -70,10 C-66,-26 -44,-34 -34,-18 C-42,-44 -22,-60 0,-78 Z" fill="url(#flame)"/>
    <path d="M6,34 C22,24 24,6 14,-8 C34,2 34,30 18,46 C2,62 -24,58 -30,38 C-16,50 -6,46 6,34 Z" fill="#0b0f0a" opacity="0.85"/>
  </g>

  <!-- title -->
  <g font-family="'Consolas','Courier New',monospace" filter="url(#glow)">
    <text x="190" y="118" font-size="62" font-weight="700" fill="#39ff14">FLARE-On</text>
    <text x="192" y="166" font-size="30" font-weight="400" fill="#b6ffb0">Challenge Solutions &amp; Write-ups</text>
  </g>

  <!-- prompt line -->
  <g font-family="'Consolas','Courier New',monospace" font-size="22">
    <text x="192" y="214" fill="#6fdc6f">user@flare:~$ </text>
    <text x="340" y="214" fill="#ffd000">cat flag*.txt</text>
    <text x="500" y="214" fill="#e9fff0"> # *@flare-on.com</text>
    <rect x="705" y="198" width="12" height="22" fill="#39ff14">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
